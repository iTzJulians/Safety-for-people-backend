spring.application.name=safety-for-people

# Sembrado inicial de datos (estados, roles, usuarios y ventas de prueba)
# Cambiar a true únicamente para repoblar una base de datos vacía.
app.data-initializer.enabled=false

spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require&sslsuppresscertificateerrors=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
